<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#5720B7">
    <title>Perfil do Comerciante - Moda Center</title>
    <link rel="stylesheet" href="css/perfil_comerciante.css">
    <link rel="stylesheet" href="css/comerciante-navigation.css">
</head>
<body>
    <main class="app">
        <section class="profile-view" id="profileView" aria-labelledby="profileTitle">
            <div class="profile-hero">
                <button class="profile-settings" id="profileSettingsButton" type="button" aria-label="Abrir configurações">⚙</button>
                <div class="profile-avatar" aria-hidden="true"><span id="profileInitials">JS</span><img id="profileAvatarImage" alt="Foto de perfil" hidden></div>
                <div class="profile-identity">
                    <p class="profile-eyebrow">Meu perfil</p>
                    <h1 id="profileTitle"><span id="profileViewName">Jhon Smit</span></h1>
                    <p class="profile-store">▣ <span id="profileStoreName">Moda &amp; Estilo</span></p>
                    <p class="profile-rating"><span>★</span> 4,75 <small>(231 avaliações)</small></p>
                </div>
                <button class="profile-camera" type="button" aria-label="Alterar foto">⌾</button>
            </div>

            <div class="profile-stat-strip" aria-label="Resumo da loja">
                <div class="profile-stat"><strong>1.290</strong><span>Vendas</span><small>Total realizadas</small></div>
                <div class="profile-stat"><strong id="profileProductsCount">620</strong><span>Produtos</span><small>Cadastrados</small></div>
                <div class="profile-stat profile-stat-rating"><strong>4,75 <span>★</span></strong><span>Avaliação média</span><small>231 avaliações</small></div>
            </div>

            <div class="profile-shortcuts">
                <div class="profile-shortcut-grid">
                    <button class="profile-shortcut shortcut-purple" type="button"><span class="shortcut-icon">◔</span><span><strong>Relatórios</strong><small>Acompanhe suas vendas, produtos e desempenho.</small></span><b>›</b></button>
                    <button class="profile-shortcut shortcut-blue" type="button"><span class="shortcut-icon">▣</span><span><strong>Configuração da loja</strong><small>Gerencie suas informações e preferências.</small></span><b>›</b></button>
                    <button class="profile-shortcut shortcut-green" type="button"><span class="shortcut-icon">★</span><span><strong>Minhas avaliações</strong><small>Veja o que seus clientes dizem sobre você.</small></span><b>›</b></button>
                    <button class="profile-shortcut shortcut-orange" type="button"><span class="shortcut-icon">↗</span><span><strong>Últimas vendas</strong><small>Acompanhe seus pedidos e entregas recentes.</small></span><b>›</b></button>
                </div>
            </div>
        </section>

        <div class="settings-backdrop" id="settingsBackdrop" aria-hidden="true">
            <section class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
                <div class="settings-heading">
                    <div><p>Minha conta</p><h2 id="settingsTitle">Configurações</h2></div>
                    <button class="settings-close" id="settingsClose" type="button" aria-label="Fechar configurações">×</button>
                </div>
                <div class="settings-account">
                    <span class="settings-avatar" id="settingsInitials">JS</span>
                    <span><strong id="settingsName">Jhon Smit</strong><small>Perfil de comerciante</small></span>
                </div>
                <div class="settings-options">
                    <button type="button" id="editProfileButton"><span>✎</span><span><strong>Editar perfil</strong><small>Atualize seus dados e sua loja</small></span><b>›</b></button>
                    <button type="button"><span>🔔</span><span><strong>Notificações</strong><small>Controle os avisos da sua conta</small></span><b>›</b></button>
                    <button type="button"><span>🔒</span><span><strong>Privacidade e segurança</strong><small>Gerencie senha e acesso</small></span><b>›</b></button>
                </div>
                <button class="settings-logout" id="settingsLogout" type="button"><span>↪</span> Sair da conta</button>
            </section>
        </div>

        <div class="profile-edit-backdrop" id="profileEditBackdrop" aria-hidden="true">
            <section class="profile-edit-panel" role="dialog" aria-modal="true" aria-labelledby="profileEditTitle">
                <div class="settings-heading">
                    <div><p>Minha conta</p><h2 id="profileEditTitle">Editar perfil</h2></div>
                    <button class="settings-close" id="profileEditClose" type="button" aria-label="Fechar edição">×</button>
                </div>
                <form id="profileEditForm">
                    <label class="profile-edit-field">Nome
                        <input id="editProfileName" name="name" type="text" required minlength="2">
                    </label>
                    <label class="profile-edit-field">E-mail
                        <input id="editProfileEmail" name="email" type="text" required>
                    </label>
                    <label class="profile-edit-field">Nome da loja
                        <input id="editStoreName" name="storeName" type="text" required minlength="2">
                    </label>
                    <fieldset class="profile-edit-segments">
                        <legend>Segmentos da loja</legend>
                        <label><input type="checkbox" name="segment" value="masculino"> Masculino</label>
                        <label><input type="checkbox" name="segment" value="feminino"> Feminino</label>
                        <label><input type="checkbox" name="segment" value="infantil"> Infantil</label>
                        <label><input type="checkbox" name="segment" value="unissex"> Unissex</label>
                    </fieldset>
                    <label class="profile-edit-field">Foto de perfil
                        <input id="editProfileImage" type="file" accept="image/*">
                    </label>
                    <img id="profileEditPreview" class="profile-edit-preview" alt="Pré-visualização da foto" hidden>
                    <label class="profile-edit-field">Foto da loja
                        <input id="editStoreImage" type="file" accept="image/*">
                    </label>
                    <img id="storeEditPreview" class="profile-edit-preview" alt="Pré-visualização da foto da loja" hidden>
                    <p class="profile-edit-note" id="profileEditNote"></p>
                    <button class="profile-edit-save" type="submit">Salvar alterações</button>
                </form>
            </section>
        </div>

        <button class="floating-button" aria-label="Adicionar"><span>+</span></button>

        <!-- Menu inferior compartilhado; somente o item Perfil fica ativo nesta tela. -->
        <nav class="bottom-navigation">
            <button class="nav-item" data-page="inicio_comerciante.html">
                <span class="nav-icon">🏠</span>
                <span class="nav-label">Início</span>
            </button>
            <button class="nav-item" data-page="chat_comerciante.html">
                <span class="nav-icon">💬</span>
                <span class="nav-label">Chat</span>
            </button>
            <div class="navigation-space"></div>
            <button class="nav-item" data-page="marketing_comerciante.html">
                <span class="nav-icon">📣</span>
                <span class="nav-label">Marketing</span>
            </button>
            <button class="nav-item active" data-page="perfil_comerciante.html">
                <span class="nav-icon">👤</span>
                <span class="nav-label">Perfil</span>
            </button>
        </nav>
    </main>
    <script src="js/comerciante-guard.js"></script>
    <script src="js/perfil_comerciante.js"></script>
</body>
</html>
