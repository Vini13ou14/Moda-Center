<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#5720B7">
    <title>Filtro - Moda Center</title>
    <link rel="stylesheet" href="css/filtro_comerciante.css">
    <link rel="stylesheet" href="css/comerciante-navigation.css">
</head>

<body>
    <main class="app">
        <header class="page-header">
            <a class="back-button" href="inicio_comerciante.html" aria-label="Voltar">‹</a>
            <div>
                <p class="eyebrow">SEUS PRODUTOS</p>
                <h1>Filtro</h1>
            </div>
            <span class="header-spacer" aria-hidden="true"></span>
        </header>

        <section class="filter-content">
            <label class="search-box">
                <span aria-hidden="true">⌕</span>
                <input id="productSearch" type="search" placeholder="Buscar produto" aria-label="Buscar produto">
            </label>

            <div class="filter-heading">
                <div>
                    <h2>Filtre seus produtos</h2>
                    <p id="productCount">0 produtos</p>
                </div>
                <button id="clearFilters" class="clear-button" type="button" hidden>Limpar</button>
            </div>

            <div class="segment-filters" role="group" aria-label="Filtrar por segmento">
                <button class="segment-filter active" type="button" data-segment="">Todos</button>
                <button class="segment-filter" type="button" data-segment="masculino">Masculino</button>
                <button class="segment-filter" type="button" data-segment="feminino">Feminino</button>
                <button class="segment-filter" type="button" data-segment="infantil">Infantil</button>
                <button class="segment-filter" type="button" data-segment="unissex">Unissex</button>
            </div>

            <div id="productsList" class="products-list" aria-live="polite"></div>
        </section>

        <div class="edit-modal-backdrop" id="editModal" hidden>
            <section class="edit-modal" role="dialog" aria-modal="true" aria-labelledby="editTitle">
                <div class="edit-modal-header">
                    <div>
                        <p class="eyebrow">GERENCIAR PRODUTO</p>
                        <h2 id="editTitle">Editar produto</h2>
                    </div>
                    <button class="modal-close" id="closeEdit" type="button" aria-label="Fechar">&times;</button>
                </div>

                <form id="editForm">
                    <input type="hidden" id="editProductId">
                    <label class="edit-field">Preço (R$)
                        <input id="editPrice" type="number" min="0.01" step="0.01" required>
                    </label>
                    <label class="edit-field">Desconto (%)
                        <input id="editDiscount" type="number" min="0" max="100" step="1" value="0">
                    </label>
                    <label class="edit-field">Quantidade disponível
                        <input id="editQuantity" type="number" min="0" step="1" value="0" required>
                    </label>
                    <label class="edit-field">Mudar foto
                        <input id="editImage" type="file" accept="image/*">
                    </label>
                    <img id="editImagePreview" class="edit-image-preview" alt="Pré-visualização da foto" hidden>
                    <p class="edit-final-price" id="editFinalPrice"></p>
                    <p class="edit-note" id="editNote"></p>
                    <button class="save-edit" type="submit">Salvar alterações</button>
                </form>
            </section>
        </div>

        <div class="details-modal-backdrop" id="detailsModal" hidden>
            <section class="details-modal" role="dialog" aria-modal="true" aria-labelledby="detailsTitle">
                <button class="modal-close details-close" id="closeDetails" type="button" aria-label="Fechar">&times;</button>
                <div id="detailsContent"></div>
            </section>
        </div>

        <button class="floating-button" id="addProduct" type="button" aria-label="Adicionar produto">+</button>

        <nav class="bottom-navigation" aria-label="Navegação principal">
            <button class="nav-item" type="button" data-page="inicio_comerciante.html">
                <span class="nav-icon">🏠</span>
                <span class="nav-label">Início</span>
            </button>
            <button class="nav-item" type="button" data-page="chat_comerciante.html">
                <span class="nav-icon">💬</span>
                <span class="nav-label">Chat</span>
            </button>
            <div class="navigation-space"></div>
            <button class="nav-item" type="button" data-page="marketing_comerciante.html">
                <span class="nav-icon">📣</span>
                <span class="nav-label">Marketing</span>
            </button>
            <button class="nav-item" type="button" data-page="perfil_comerciante.html">
                <span class="nav-icon">👤</span>
                <span class="nav-label">Perfil</span>
            </button>
        </nav>
    </main>

    <script src="js/comerciante-guard.js"></script>
    <script src="js/filtro_comerciante.js"></script>
</body>

</html>
