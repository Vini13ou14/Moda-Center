<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moda Center | Catálogo</title>
    <link rel="shortcut icon" href="../assets/images/logo.png" type="image/">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/pages/catalogo.css">
</head>
<body>
<div class="app">
<header>
    <div class="brand-container">
        <img class="brand-logo" src="../assets/images/logo.png" alt="Moda Center">

        <div class="brand-info">
            <h3>MODA<br>CENTER</h3>
            <p>SANTA CRUZ</p>
        </div>
    </div>

    <div class="header-actions">
        <div>&hearts;</div>
        <div>&Coproduct;</div>
    </div>
</header>

<div class="category-options">
    <div class="category-item">
        <div class="category-icon"></div>
        Masculino
    </div>

    <div class="category-item">
        <div class="category-icon"></div>
        Feminino
    </div>

    <div class="category-item">
        <div class="category-icon"></div>
        Infantil
    </div>

    <div class="category-item">
        <div class="category-icon"></div>
        Calçados
    </div>

    <div class="category-item">
        <div class="category-icon"></div>
        Acessórios
    </div>

    <div class="category-item">
        <div class="category-icon"></div>
        Outros
    </div>
</div>

<main>
    <div class="featured-carousel"></div>

    <section class="quick-functions">
        <div class="quick-function"></div>
        <div class="quick-function"></div>
    </section>

    <section class="featured-stores">
        <div class="section-header">
            <div class="section-title">Lojas em Destaque</div>
            <div class="section-link">Ver todas</div>
        </div>

        <div class="horizontal-list">
            <div class="horizontal-item"></div>
            <div class="horizontal-item"></div>
            <div class="horizontal-item"></div>
            <div class="horizontal-item"></div>
            <div class="horizontal-item"></div>
        </div>
    </section>

    <section class="featured-products">
        <div class="section-header">
            <div class="section-title">Produtos mais vendidos</div>
            <div class="section-link">Ver todos</div>
        </div>

        <div class="horizontal-list">
            <div class="horizontal-item"></div>
            <div class="horizontal-item"></div>
            <div class="horizontal-item"></div>
            <div class="horizontal-item"></div>
            <div class="horizontal-item"></div>
            <div class="horizontal-item"></div>
        </div>
    </section>
</main>

<footer class="bottom-navigation">
    <div class="navigation-item">
        <div id="home" class="navigation-icon"></div>
        <span>Início</span>
    </div>

    <div class="navigation-item">
        <div id="chat" class="navigation-icon"></div>
        <span>Chat</span>
    </div>

    <div class="navigation-item">
        <div id="create" class="navigation-icon"><span>&plus;</span></div>
    </div>

    <div class="navigation-item">
        <div id="cart" class="navigation-icon"></div>
        <span>Carrinho</span>
    </div>

    <div class="navigation-item">
        <div id="profile" class="navigation-icon"></div>
        <span>Perfil</span>
    </div>
</footer>
</body>
</html>
