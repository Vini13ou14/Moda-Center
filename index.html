<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5520b8">
<title>Moda Center Santa Cruz</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <section class="hero">
    <div class="orange-shape"></div>
    <div class="content">
      <img class="logo" src="logo.png" alt="Moda Center">
      <h1>MODA<br>CENTER</h1>
      <div class="city">SANTA CRUZ</div>
      <div class="divider"></div>
      <div class="subtitle">O MAIOR CENTRO DE MODA<br>DA <b>AM&Eacute;RICA LATINA</b></div>
    </div>
    <div class="photo"></div>
    <div class="white-curve"></div>
  </section>

  <section class="bottom">
    <nav class="nav" aria-label="Menu principal">
      <div class="nav-item"><div class="icon">&#9831;</div><span>COMPRE<br>COM FACILIDADE</span></div>
      <div class="nav-item"><div class="icon">&#8982;</div><span>ENCONTRE<br>LOJAS</span></div>
      <div class="nav-item"><div class="icon">&#9826;</div><span>OFERTAS<br>EXCLUSIVAS</span></div>
      <div class="nav-item"><div class="icon">&#9633;</div><span>EVENTOS<br>E NOVIDADES</span></div>
      <div class="nav-item"><div class="icon">&#9825;</div><span>FAVORITOS<br>E MUITO MAIS</span></div>
    </nav>

    <div class="actions">
      <button class="primary" data-auth="login">ENTRAR</button>
      <button data-auth="register">CADASTRAR</button>
    </div>
  </section>
  <section class="account-page" id="accountPage" aria-live="polite">
    <div class="account-content">
      <img class="auth-logo" src="logo.png" alt="Moda Center">
      <h2>VocÃª entrou na sua conta</h2>
      <p id="accountMessage">Bem-vindo(a) ao Moda Center.</p>
      <button class="logout-button" id="logoutButton">SAIR E VOLTAR AO INÃCIO</button>
    </div>
  </section>
</div>
<div class="toast" id="toast"></div>
<div class="modal-backdrop" id="authBackdrop" role="dialog" aria-modal="true" aria-labelledby="authTitle">
  <div class="auth-modal">
    <button class="close-modal" id="closeModal" aria-label="Fechar">&times;</button>
    <img class="auth-logo" src="logo.png" alt="">
    <h2 id="authTitle">Acesse sua conta</h2>
    <p id="authDescription">Entre para acompanhar suas lojas e favoritos.</p>
    <div class="auth-tabs" role="tablist">
      <button class="auth-tab active" data-tab="login" role="tab">ENTRAR</button>
      <button class="auth-tab" data-tab="register" role="tab">CADASTRAR</button>
    </div>
    <form class="auth-form active" id="loginForm">
      <label class="field">E-MAIL<input type="email" name="email" autocomplete="email" required></label>
      <label class="field">SENHA<input type="password" name="password" autocomplete="current-password" required minlength="6"></label>
      <button class="auth-submit" type="submit">ENTRAR NA MINHA CONTA</button>
      <p class="auth-note" id="loginNote"></p>
    </form>
    <form class="auth-form" id="registerForm">
      <label class="field">NOME<input type="text" name="name" autocomplete="name" required minlength="2"></label>
      <label class="field">E-MAIL<input type="email" name="email" autocomplete="email" required></label>
      <label class="field">SENHA<input type="password" name="password" autocomplete="new-password" required minlength="6"></label>
      <button class="auth-submit" type="submit">CRIAR MINHA CONTA</button>
      <p class="auth-note" id="registerNote"></p>
    </form>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
